name: native

on:
  push:
    branches: [develop, feat/port-samples] # the port's branch too: Linux and macOS are built nowhere else
    paths: ['native/**', 'src/core/**', 'src/audio/**', '.github/workflows/native.yml']
  pull_request:
    branches: [develop]
    paths: ['native/**', 'src/core/**', 'src/audio/**', '.github/workflows/native.yml']

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, optional: false }
          - { os: ubuntu-24.04, optional: false }
          - { os: macos-latest, optional: true } # compile check only, may fail
    steps:
      - uses: actions/checkout@v5

      # the parity test reads the web app from src/ of the checkout (native/tools/export-events.mjs)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Linux packages for JUCE
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev libwebkit2gtk-4.1-dev

      # the beat model is not in the repository; without it the tests skip the model
      - name: Models
        run: node native/tools/get-models.mjs

      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build native/build --config Release --parallel

      - name: Test
        run: ctest --test-dir native/build -C Release -V

      - name: Upload the Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: backingtrack-windows
          path: |
            native/build/app/BackingtrackApp_artefacts/Release/Standalone/*.exe
            native/build/app/BackingtrackApp_artefacts/Release/Standalone/*.dll
          if-no-files-found: error
