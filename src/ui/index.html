<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>
<!-- Alle sichtbaren Texte setzt app.js über t(): data-i18n = Text, data-i18n-label = aria-label -->
<header class="top">
  <div class="lang" role="group" data-i18n-label="ui.language">
    <button type="button" class="chip" data-lang="de" lang="de" data-i18n="ui.langDe" data-i18n-label="ui.langDeName"></button>
    <button type="button" class="chip" data-lang="en" lang="en" data-i18n="ui.langEn" data-i18n-label="ui.langEnName"></button>
  </div>
</header>
<main>
  <h1 class="visually-hidden" data-i18n="ui.title"></h1>
  <section class="start" id="start">
    <p class="tonight" id="tonight" data-i18n="ui.tonight"></p>
    <p class="sentence" id="sentence">
      <button type="button" class="word" id="key-btn" popovertarget="key-pop" aria-haspopup="dialog" aria-expanded="false" aria-controls="key-pop"></button>
      <span data-i18n="ui.styleIn"></span>
      <button type="button" class="word" id="style-btn" popovertarget="style-pop" aria-haspopup="dialog" aria-expanded="false" aria-controls="style-pop"></button>
      <br>
      <span data-i18n="ui.atTempo"></span>
      <button type="button" class="word" id="tempo-btn" popovertarget="tempo-pop" aria-haspopup="dialog" aria-expanded="false" aria-controls="tempo-pop"></button>
    </p>

    <div class="pop" id="key-pop" popover role="dialog" aria-labelledby="key-btn">
      <p class="pop-label" id="key-label" data-i18n="ui.key"></p>
      <div class="chips" role="group" aria-labelledby="key-label" id="key-chips"></div>
      <p class="pop-label" id="scale-label" data-i18n="ui.scale"></p>
      <div class="chips" role="group" aria-labelledby="scale-label" id="scale-chips"></div>
    </div>
    <div class="pop" id="style-pop" popover role="dialog" aria-labelledby="style-btn">
      <p class="pop-label" id="style-label" data-i18n="ui.style"></p>
      <div class="cards" role="group" aria-labelledby="style-label" id="style-cards"></div>
    </div>
    <div class="pop" id="tempo-pop" popover role="dialog" aria-labelledby="tempo-btn">
      <label class="pop-label" for="tempo" data-i18n="ui.tempo"></label>
      <div class="tempo-row">
        <input type="range" id="tempo" min="40" max="200" step="1">
        <span><output id="tempo-out" for="tempo"></output> <span data-i18n="ui.bpm"></span></span>
      </div>
    </div>

    <p class="variant">
      <label for="variant" data-i18n="ui.variant"></label>
      <input type="number" id="variant" min="1" max="9999" step="1" inputmode="numeric">
      · <span data-i18n="ui.chords"></span>: <span id="chords"></span>
    </p>
    <button type="button" class="go" id="go"></button>
    <div class="now">
      <p class="now-chord" id="now-chord"></p>
      <p class="position" id="position"></p>
    </div>
    <p class="message" id="message" aria-live="polite"></p>
    <p class="actions">
      <button type="button" class="chip" id="to-play" data-i18n="ui.toPlayPage" hidden></button>
      <button type="button" class="chip" id="new-variant" data-i18n="ui.newVariant"></button>
      <button type="button" class="chip" id="tune-btn" data-i18n="ui.fineTune"></button>
    </p>
  </section>

  <!-- Spielseite: Kopfzeile, darunter Blöcke (Visualisierungen), Leiste "Klang" und Leiste "Akkorde"; Knöpfe baut tuning.js.
       DOM-Reihenfolge = Tab-Reihenfolge = schmale Ansicht; breit stellt das Raster die Leisten links und rechts daneben. -->
  <section class="play" id="play" aria-labelledby="play-title" hidden>
    <div class="play-head">
      <button type="button" class="chip" id="play-back" data-i18n="ui.toStart"></button>
      <h2 class="visually-hidden" id="play-title" tabindex="-1" data-i18n="ui.playPage"></h2>
      <p class="play-now" id="play-now"></p>
      <p class="play-next" id="play-next"></p>
      <p class="position" id="play-position"></p>
      <button type="button" class="go" id="play-go"></button>
      <p class="play-variant" id="play-variant"></p>
      <div class="play-toggles">
        <button type="button" class="chip side-toggle" id="toggle-left" aria-expanded="false" aria-controls="side-left" data-i18n="ui.sidebarSound"></button>
        <button type="button" class="chip side-toggle" id="toggle-right" aria-expanded="false" aria-controls="side-right" data-i18n="ui.sidebarChords"></button>
      </div>
      <p class="message" id="play-message" aria-live="polite"></p>
    </div>

    <div class="stage">
      <div class="blocks" id="blocks">
        <section class="block" data-view="fretboard" aria-labelledby="view-fretboard-title">
          <div class="block-head">
            <h3 class="block-title" id="view-fretboard-title" data-i18n="view.fretboard"></h3>
            <div class="chips" role="group" data-i18n-label="ui.labelsGroup">
              <button type="button" class="chip" id="labels-names" data-labels="names" data-i18n="ui.labelNames"></button>
              <button type="button" class="chip" id="labels-degrees" data-labels="degrees" data-i18n="ui.labelDegrees"></button>
            </div>
          </div>
          <!-- SVG baut fretboard.js; schmal scrollt nur dieser Bereich waagerecht, nie die Seite -->
          <div class="fretboard-scroll" id="fretboard" tabindex="0" role="region" data-i18n-label="view.fretboard"></div>
          <!-- Legende: Zeichen wie auf dem Griffbrett (dekorativ), Bedeutung steht als Text daneben -->
          <ul class="legend" id="fretboard-legend">
            <li><svg viewBox="-16 -16 32 32" aria-hidden="true"><g class="fret-note" data-role="scale"><rect class="dot"/></g></svg><span data-i18n="ui.legendScale"></span></li>
            <li><svg viewBox="-16 -16 32 32" aria-hidden="true"><g class="fret-note" data-role="current"><rect class="dot"/></g></svg><span data-i18n="ui.legendCurrent"></span></li>
            <li><svg viewBox="-16 -16 32 32" aria-hidden="true"><g class="fret-note" data-role="current root"><circle class="ring"/><rect class="dot"/></g></svg><span data-i18n="ui.legendRoot"></span></li>
            <li><svg viewBox="-16 -16 32 32" aria-hidden="true"><g class="fret-note" data-role="next"><rect class="dot"/></g></svg><span data-i18n="ui.legendNext"></span></li>
            <li><svg viewBox="-16 -16 32 32" aria-hidden="true"><g class="fret-note" data-role="both"><rect class="dot"/></g></svg><span data-i18n="ui.legendBoth"></span></li>
            <li><svg viewBox="-16 -16 32 32" aria-hidden="true"><g class="fret-note" data-role="current outside"><rect class="dot"/></g></svg><span data-i18n="ui.legendOutside"></span></li>
          </ul>
          <p class="visually-hidden" id="fretboard-text"></p>
        </section>
        <section class="block" data-view="lanes" aria-labelledby="view-lanes-title">
          <h3 class="block-title" id="view-lanes-title" data-i18n="view.lanes"></h3>
          <div class="lanes">
            <div class="lane-buttons" id="lane-buttons" role="group" data-i18n-label="ui.layers"></div>
            <canvas id="lanes" role="img" data-i18n-label="ui.lanesLabel"></canvas>
          </div>
        </section>
        <section class="block" data-view="wheel" aria-labelledby="view-wheel-title">
          <h3 class="block-title" id="view-wheel-title" data-i18n="view.wheel"></h3>
          <canvas class="wheel" id="wheel" role="img" width="380" height="380" data-i18n-label="ui.wheelLabel"></canvas>
        </section>
      </div>

      <!-- Leisten: breit neben den Blöcken, schmal als Schublade darüber; offen/zu, Fokus und Escape macht sidebar.js -->
      <aside class="side" id="side-left" aria-labelledby="side-left-title" hidden>
        <div class="side-head">
          <h3 class="side-title" id="side-left-title" tabindex="-1" data-i18n="ui.sidebarSound"></h3>
          <button type="button" class="chip side-close" data-i18n="ui.close"></button>
        </div>
        <h4 class="label" id="quick-title" data-i18n="ui.quickPick"></h4>
        <div class="chips" id="quick-pick" role="group" aria-labelledby="quick-title"></div>
        <div class="settings">
          <label class="label" for="tuning-tempo" data-i18n="ui.tempo"></label>
          <div class="tempo-row">
            <input type="range" id="tuning-tempo" min="40" max="200" step="1">
            <span><output id="tuning-tempo-out" for="tuning-tempo"></output> <span data-i18n="ui.bpm"></span></span>
          </div>
          <label class="label" for="length" data-i18n="ui.length"></label>
          <select id="length"></select>
        </div>
        <h4 class="label" data-i18n="ui.tags"></h4>
        <div id="tags"></div>
      </aside>

      <aside class="side" id="side-right" aria-labelledby="side-right-title" hidden>
        <div class="side-head">
          <h3 class="side-title" id="side-right-title" tabindex="-1" data-i18n="ui.sidebarChords"></h3>
          <button type="button" class="chip side-close" data-i18n="ui.close"></button>
        </div>
        <h4 class="label" id="side-key-label" data-i18n="ui.key"></h4>
        <div class="chips" role="group" aria-labelledby="side-key-label" id="side-key-chips"></div>
        <h4 class="label" id="side-scale-label" data-i18n="ui.scale"></h4>
        <div class="chips" role="group" aria-labelledby="side-scale-label" id="side-scale-chips"></div>
        <h4 class="label" id="progression-title" data-i18n="ui.progression"></h4>
        <div class="chips" id="progression" role="group" aria-labelledby="progression-title"></div>
        <p class="message" id="tuning-message" aria-live="polite"></p>
        <h4 class="label" id="add-title" data-i18n="ui.addChord"></h4>
        <div class="chips" id="add-chords" role="group" aria-labelledby="add-title"></div>
      </aside>
    </div>
  </section>
</main>
</body>
</html>
