<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spektrogramm</title>
<link rel="icon" href="data:,">
<style>
  body { font: 14px system-ui, sans-serif; background: #15151a; color: #ddd; margin: 12px; }
  canvas { display: block; background: #000; max-width: 100%; }
  pre { white-space: pre-wrap; }
  input[type=file] { margin-left: 8px; }
</style>
</head>
<body>
<!-- Entwicklerseite (nicht Teil der Oberfläche): zeichnet eine Stimme (und optional eine Referenzaufnahme) als Spektrogramm mit Obertonverläufen.
     Aufruf: spectrogram.html?layer=bass&id=string&variant=finger&midi=40&vel=0.8&dur=0.8&seconds=1.5[&tuning={json}][&ref=/pfad.wav]
     Als Bild: node scripts/spectrogram.mjs <ausgabe.png> "<query>" [referenz.wav] -->
<p>
  Stimme: <span id="title"></span>
  <label>Referenz <input type="file" id="ref-file" accept="audio/*"></label>
</p>
<canvas id="plot" width="1000" height="520"></canvas>
<pre id="metrics"></pre>
<script type="module">
import { renderNote } from '../audio/render.js';
import { stft, harmonicTracks, attackTime, pitchCents } from '../audio/analysis.js';
import { spectralCentroid } from '../audio/spectrum.js';
import { VOICE_LAYERS, isVoice, VOICES } from '../core/voices.js';

const SR = 44100;
const q = new URLSearchParams(location.search);
const num = (name, fallback, lo, hi) => {
  const raw = q.get(name);
  const v = raw === null || raw === '' ? NaN : Number(raw);
  return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : fallback;
};
const layerOk = VOICE_LAYERS.includes(q.get('layer'));
const layer = layerOk ? q.get('layer') : 'chords';
const midi = num('midi', 57, 12, 120);
const id = q.get('id') ?? 'synth';
// Ungültiges fällt auf den Standard zurück (wie bei den Instrumenten); der Titel sagt es, damit man nicht die falsche Stimme misst
const variantGiven = q.get('variant') ?? undefined;
const idOk = isVoice(layer, id) && (variantGiven === undefined || isVoice(layer, id, variantGiven));
const voices = { [layer]: idOk ? { id, variant: variantGiven ?? VOICES[layer][id].variants[0] } : { id: 'synth', variant: 'classic' } };
let tuning;
try { tuning = q.get('tuning') ? JSON.parse(q.get('tuning')) : undefined; } catch { tuning = undefined; }
document.getElementById('title').textContent = `${layer} ${voices[layer].id}/${voices[layer].variant} MIDI ${midi}`
  + (layerOk && idOk ? '' : `  (ungültige Angabe layer=${q.get('layer')} id=${id} variant=${variantGiven}: Standard)`);

const canvas = document.getElementById('plot');
const g = canvas.getContext('2d');
const PANEL_H = 520, SPEC_H = 330, LEFT = 56, RIGHT = 10, TOP = 22;
const F_MIN = 40, F_MAX = 12000, FLOOR = -80;

// Farbverlauf für dB-Werte: schwarz, blau, violett, orange, weiß
function color(db) {
  const x = Math.min(1, Math.max(0, (db - FLOOR) / -FLOOR));
  const stops = [[0, 0, 0, 0], [0.3, 20, 20, 140], [0.55, 150, 30, 160], [0.8, 240, 140, 30], [1, 255, 255, 235]];
  for (let i = 1; i < stops.length; i++) {
    if (x <= stops[i][0]) {
      const [x0, ...a] = stops[i - 1], [x1, ...b] = stops[i], k = (x - x0) / (x1 - x0);
      return a.map((v, j) => Math.round(v + (b[j] - v) * k));
    }
  }
  return [255, 255, 235];
}

// Ab dem ersten hörbaren Einsatz (5 % der Spitze) mit 20 ms Vorlauf, damit Stimme und Referenz am gleichen Punkt beginnen
function trimToOnset(samples) {
  let peak = 0;
  for (const v of samples) peak = Math.max(peak, Math.abs(v));
  let i = 0;
  while (i < samples.length && Math.abs(samples[i]) < 0.05 * peak) i++;
  return samples.subarray(Math.max(0, i - Math.round(0.02 * SR)));
}

function panel(index, label, raw) {
  const samples = trimToOnset(raw);
  const y0 = index * PANEL_H;
  const w = canvas.width - LEFT - RIGHT;
  const spec = stft(samples, SR, { size: 2048, hop: 512 });
  const duration = samples.length / SR;
  g.fillStyle = '#000'; g.fillRect(0, y0, canvas.width, PANEL_H);
  // Spektrogramm: x = Zeit, y = Frequenz logarithmisch
  const image = g.createImageData(w, SPEC_H);
  for (let y = 0; y < SPEC_H; y++) {
    const f = F_MIN * (F_MAX / F_MIN) ** (1 - y / (SPEC_H - 1));
    const bin = Math.min(spec.freqs.length - 1, Math.round((f * 2048) / SR));
    for (let x = 0; x < w; x++) {
      const frame = Math.min(spec.db.length - 1, Math.floor((x / w) * spec.db.length));
      const [r, gr, b] = color(spec.db[frame][bin]);
      const at = (y * w + x) * 4;
      image.data[at] = r; image.data[at + 1] = gr; image.data[at + 2] = b; image.data[at + 3] = 255;
    }
  }
  g.putImageData(image, LEFT, y0 + TOP);
  g.fillStyle = '#ddd'; g.font = '12px system-ui'; g.fillText(label, LEFT, y0 + 14);
  for (const f of [100, 200, 500, 1000, 2000, 5000, 10000]) {
    const y = y0 + TOP + SPEC_H * (1 - Math.log(f / F_MIN) / Math.log(F_MAX / F_MIN));
    g.fillStyle = 'rgba(255,255,255,0.25)'; g.fillRect(LEFT, y, w, 1);
    g.fillStyle = '#ddd'; g.fillText(f >= 1000 ? `${f / 1000}k` : String(f), 4, y + 4);
  }
  // Obertonverläufe unter dem Spektrogramm
  const hy = y0 + TOP + SPEC_H + 14, hh = PANEL_H - SPEC_H - TOP - 24;
  g.strokeStyle = '#333'; g.strokeRect(LEFT, hy, w, hh);
  g.fillStyle = '#ddd'; g.fillText('Obertöne 1 bis 8 (dB, 0 bis -80)', LEFT, hy - 3);
  const f0 = 440 * 2 ** ((midi - 69) / 12);
  const tracks = harmonicTracks(samples, SR, f0, 8, { hop: 512 });
  tracks.forEach((track, i) => {
    g.strokeStyle = `hsl(${i * 42}, 85%, 60%)`;
    g.beginPath();
    track.db.forEach((db, k) => {
      const x = LEFT + (track.times[k] / duration) * w, y = hy + hh * (1 - (Math.max(FLOOR, db) - FLOOR) / -FLOOR);
      if (k === 0) g.moveTo(x, y); else g.lineTo(x, y);
    });
    g.stroke();
  });
  for (let s = 0; s <= duration; s += 0.25) {
    const x = LEFT + (s / duration) * w;
    g.fillStyle = '#ddd'; g.fillText(`${s.toFixed(2)}`, x, y0 + PANEL_H - 4);
  }
  return `${label}: Anschlag ${(attackTime(samples, SR) * 1000).toFixed(1)} ms, Grundton ${pitchCents(samples, SR, midi).toFixed(1)} Cent, Schwerpunkt ${Math.round(spectralCentroid(samples, SR))} Hz, Länge ${duration.toFixed(2)} s`;
}

// Zeichnen nacheinander (die Datei-Auswahl kann ein laufendes Zeichnen überholen), Fehler landen in data-ready="error"
let queue = Promise.resolve();
function drawAll(refSamples) {
  queue = queue.then(async () => {
    try {
      canvas.height = PANEL_H * (refSamples ? 2 : 1);
      const rows = [];
      const note = await renderNote(layer, { midi, vel: num('vel', 0.8, 0, 1), dur: num('dur', 0.8, 0.05, 5), seconds: num('seconds', 1.5, 0.3, 6), voices, tuning, sampleRate: SR });
      rows.push(panel(0, 'Stimme', note));
      if (refSamples) rows.push(panel(1, 'Referenz', refSamples));
      document.getElementById('metrics').textContent = rows.join('\n');
      canvas.dataset.ready = String(refSamples ? 2 : 1);
    } catch (err) {
      document.getElementById('metrics').textContent = `Fehler: ${err.message}`;
      canvas.dataset.ready = 'error';
    }
  });
  return queue;
}

async function decode(buffer) {
  const ctx = new OfflineAudioContext(1, 1, SR);
  return (await ctx.decodeAudioData(buffer)).getChannelData(0);
}

document.getElementById('ref-file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (file) await drawAll(await decode(await file.arrayBuffer()));
});

const refUrl = q.get('ref');
if (refUrl) await drawAll(await decode(await (await fetch(refUrl)).arrayBuffer()));
else await drawAll(null);
</script>
</body>
</html>
