<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Render-Harness</title>
<link rel="icon" href="data:,">
</head>
<body>
<!-- Entwicklerseite (nicht Teil der Oberfläche): window.__render/__compare für Pegel- und Klangtests und Hörprobe der drei Stile -->
<h1>Hörprobe</h1>
<p>
  <button data-style="funk">Funk</button>
  <button data-style="psych">Psych</button>
  <button data-style="dreamy">Dreamy</button>
  <button id="stop">Stopp</button>
</p>
<script type="module">
import { compareRenders, renderOffline } from '../audio/render.js';
import { play } from '../audio/play.js';
import { STYLE_PRESETS } from '../core/tags.js';

window.__render = renderOffline;
window.__compare = compareRenders;

let ctx = null;
let playback = null;

function stop() {
  playback?.stop();
  ctx?.close();
  playback = ctx = null;
}

function start(id) {
  stop();
  const preset = STYLE_PRESETS.find((p) => p.id === id);
  ctx = new AudioContext();
  playback = play(ctx, {
    key: { root: 'A', mode: 'minor' },
    bpm: preset.bpm,
    bars: [['A', 'min'], ['A', 'min'], ['D', 'min'], ['E', 'maj']].map(([root, quality]) => ({ chord: { root, quality }, beats: 4 })),
    tags: preset.tags,
    seed: 1,
  }, { loops: Infinity });
}

for (const b of document.querySelectorAll('[data-style]')) b.addEventListener('click', () => start(b.dataset.style));
document.getElementById('stop').addEventListener('click', stop);
</script>
</body>
</html>
