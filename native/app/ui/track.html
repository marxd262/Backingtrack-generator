<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eigener Track</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<style>
  /* Page for a loaded track. Modules, displays, fretboard and chord wheel are the generator's (app.css);
     below only what this page adds. */
  body { display: block; min-height: 100dvh; }
  .track-page { display: flex; flex-direction: column; gap: 3px; padding: 3px; min-height: 100dvh; }
  .track-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 12px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--panel-edge); }
  .track-head .field { flex: none; }
  .track-head .grow { flex: 1 1 14rem; min-width: 0; }
  .btn { min-height: var(--target); padding: 0 14px; border: 1.5px solid var(--black); border-radius: 4px; background: var(--key); color: var(--key-ink); font: 600 14px var(--sans); cursor: pointer; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn:focus-visible, select:focus-visible, input:focus-visible, .lane:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  .btn.go { background: var(--pink); color: var(--on-accent); min-width: 7rem; }
  .btn[aria-pressed="true"] { background: var(--teal); color: var(--on-accent); }
  #title { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
  .lbl { font-size: 12px; color: var(--ink-soft); }
  select.pick { min-height: var(--target); padding: 0 8px; background: var(--lcd); color: var(--lcd-ink); border: 1.5px solid var(--black); font: 16px var(--mono); }
  progress { width: 100%; height: 12px; accent-color: var(--teal); }
  .track-top { display: flex; gap: 3px; align-items: stretch; }
  .track-top > .module { display: flex; flex-direction: column; }
  #mod-now { flex: 0 0 17rem; gap: 6px; }
  #mod-fretboard { flex: 1 1 40rem; }
  /* the board keeps its size whatever the modules beside it show (a size that follows them brings scroll bars) */
  #fretboard { flex: none; height: 264px; }
  #mod-wheel { flex: 0 0 17rem; align-items: center; }
  @media (max-width: 1100px) { .track-top { flex-wrap: wrap; } #mod-now, #mod-wheel { flex: 1 1 17rem; } #mod-fretboard { order: 3; flex-basis: 100%; } }
  .big { font-size: 58px; line-height: 1.1; text-align: center; margin: 0; padding: 4px 8px; }
  .mid { font-size: 30px; text-align: center; margin: 0; padding: 4px 8px; }
  .pattern { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; min-height: 58px; margin: 0; padding: 0; list-style: none; } /* room for two rows, so most changes of the pattern move nothing */
  .pattern li { padding: 3px 8px; min-width: 2.6rem; text-align: center; background: var(--white); border: 1.5px solid var(--panel-edge); border-radius: 4px; font: 600 14px var(--sans); color: #111; }
  .pattern li.on { background: var(--pink); border-color: var(--black); }
  .sections { display: flex; flex-wrap: wrap; gap: 4px; }
  .sections button { min-height: 28px; padding: 0 8px; border: 1.5px solid var(--panel-edge); border-radius: 4px; background: var(--field); font: 12px var(--mono); color: var(--ink); cursor: pointer; }
  .sections button.on { border-color: var(--black); background: var(--pink-soft); }
  .lane-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 8px; }
  .lane-tools .hint { flex: 1 1 16rem; margin: 0; font-size: 12px; color: var(--ink-soft); }
  /* the lane scrolls in itself, sideways; the page never does */
  .lane { position: relative; height: 136px; overflow-x: auto; overflow-y: hidden; background: var(--lcd); border: 1.5px solid var(--black); scrollbar-width: thin; }
  #mod-now .lcd { white-space: normal; overflow-wrap: anywhere; }
  .place { display: flex; flex-wrap: wrap; gap: 4px; }
  .place .lcd { margin: 0; }
  .lane canvas { position: sticky; left: 0; display: block; }
  .lane .spacer { height: 1px; margin-top: -1px; }
  #mod-video video { display: block; max-width: 100%; max-height: 36vh; margin: 0 auto; background: #000; }
  input[type="range"].plain { width: 9rem; accent-color: var(--teal); min-height: var(--target); }
</style>
</head>
<body>
<main class="track-page">
  <section class="track-head" data-i18n-label="track.track">
    <button class="btn" id="open" data-i18n="track.open"></button>
    <button class="btn go" id="play" data-i18n="track.start" disabled></button>
    <div class="field grow"><span class="lbl" data-i18n="track.track"></span><span id="title" data-i18n="track.none"></span></div>
    <div class="field"><span class="lbl" data-i18n="track.tempo"></span><span class="lcd" id="tempo">–</span></div>
    <div class="field"><label class="lbl" for="rate"><span data-i18n="track.speed"></span> <output id="rate-out">100 %</output></label><input class="plain" type="range" id="rate" min="50" max="125" step="5" value="100" disabled></div>
    <div class="field"><span class="lbl" data-i18n="track.key"></span><span class="lcd" id="key">–</span></div>
    <div class="field"><label class="lbl" for="scale" data-i18n="track.scale"></label><select class="pick" id="scale" disabled></select></div>
    <button class="btn" id="video-toggle" aria-pressed="true" data-i18n="track.video" hidden></button>
    <button class="btn" id="generator" data-i18n="track.generator"></button>
  </section>
  <section class="module" id="loading" hidden>
    <span class="lbl" id="loading-text"></span>
    <progress id="progress" max="1" value="0"></progress>
  </section>
  <div class="track-top">
    <section class="module" id="mod-now" data-i18n-label="track.chord">
      <h3 class="module-title" data-i18n="track.chord"></h3>
      <span class="lbl" data-i18n="track.now"></span>
      <p class="lcd big" id="chord">–</p>
      <span class="lbl" id="next-label" data-i18n="track.next"></span>
      <p class="lcd alt mid" id="next">–</p>
      <span class="lbl" id="pattern-label" data-i18n="track.pattern"></span>
      <ul class="pattern" id="pattern"></ul>
      <span class="lbl" data-i18n="track.place"></span>
      <div class="place"><p class="lcd" id="position">–</p><p class="lcd alt" id="time">–</p></div>
    </section>
    <!-- the generator's fretboard module; its content is built by fretboard.js -->
    <section class="module" id="mod-fretboard" aria-labelledby="mod-fretboard-title"></section>
    <section class="module" id="mod-wheel" data-i18n-label="mod.wheel">
      <h3 class="module-title" data-i18n="mod.wheel"></h3>
      <canvas class="wheel" id="wheel" role="img" width="380" height="380" data-i18n-label="track.wheelLabel"></canvas>
    </section>
  </div>
  <section class="module" id="mod-video" data-i18n-label="track.video" hidden>
    <h3 class="module-title" data-i18n="track.video"></h3>
    <video id="video" muted playsinline preload="auto" data-i18n-label="track.videoLabel"></video>
  </section>
  <section class="module" id="mod-lane" data-i18n-label="track.lane">
    <h3 class="module-title" data-i18n="track.lane"></h3>
    <div class="lane-tools">
      <span><button class="btn" id="zoom-out" data-i18n-label="track.zoomOut" disabled>−</button> <button class="btn" id="zoom-in" data-i18n-label="track.zoomIn" disabled>+</button> <button class="btn" id="zoom-all" data-i18n="track.zoomAll" disabled></button></span>
      <button class="btn" id="loop-off" data-i18n="track.loopOff" disabled></button>
      <div class="field"><label class="lbl" for="edit" data-i18n="track.edit"></label><select class="pick" id="edit" disabled></select></div>
      <div class="field"><span class="lbl" data-i18n="track.shift"></span><span><button class="btn" id="one-back" disabled data-i18n-label="track.shiftBack">◀</button> <button class="btn" id="one-on" disabled data-i18n-label="track.shiftOn">▶</button></span></div>
      <div class="field"><span class="lbl" data-i18n="track.count"></span><span><button class="btn" id="tempo-half" disabled data-i18n-label="track.countHalf">÷2</button> <button class="btn" id="tempo-double" disabled data-i18n-label="track.countDouble">×2</button></span></div>
      <button class="btn" id="reset" data-i18n="track.reset" disabled></button>
      <p class="hint" data-i18n="track.hint"></p>
    </div>
    <div class="sections" id="sections" data-i18n-label="track.sectionsLabel"></div>
    <div class="lane" id="lane" tabindex="0" role="application" data-i18n-label="track.laneLabel">
      <canvas id="lane-canvas"></canvas>
      <div class="spacer" id="lane-spacer"></div>
    </div>
  </section>
</main>
<script type="module" src="track.js"></script>
</body>
</html>
